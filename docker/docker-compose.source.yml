# 从源码构建并运行 xiaozhi-client（包含 fork 的本地改动）
# 在仓库根目录执行：
#   docker compose -f docker/docker-compose.source.yml up -d --build
#
# 注意：xiaozhi-client 会广播 mDNS 服务（_xiaozhi._tcp.local）供 ESP32 设备自动发现盒子。
# 组播只能在 host 网络收发，bridge 网络收不到。若需要「设备自动发现」，请给本服务加
#   network_mode: host
# 并删掉下面的 ports: 映射（host 模式端口直接绑宿主机 9999/3000）。
# 不加 host 网络时，设备只能用 ws://<板IP>:3000/ 手动指向。
services:
  xiaozhi-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.source
    image: xiaozhi-client:source
    container_name: xiaozhi-client
    restart: unless-stopped

    ports:
      - "9999:9999"    # Web UI 端口
      - "3000:3000"    # 备用端口

    environment:
      - NODE_ENV=production
      - XIAOZHI_WORKSPACE=/workspaces
      - XIAOZHI_CONTAINER=true
      - XIAOZHI_CONFIG_DIR=/workspaces

    # 配置 / 日志持久化到宿主机 ~/xiaozhi-client
    volumes:
      - ~/xiaozhi-client:/workspaces

    healthcheck:
      test: ["CMD", "node", "/app/dist/cli/index.js", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
